<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Cloud Player</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #f5f5f5);
            margin: 0; padding: 15px;
        }
        .player-container {
            background: var(--tg-theme-secondary-bg-color, #202b36);
            padding: 15px; border-radius: 12px; margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: var(--tg-theme-button-color, #5288c1); }
        .track-info { margin-bottom: 10px; font-weight: bold; }
        audio { width: 100%; margin-top: 10px; }
        .track-item {
            background: var(--tg-theme-secondary-bg-color, #202b36);
            padding: 12px; border-radius: 8px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .btn {
            background: var(--tg-theme-button-color, #5288c1);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;
        }
        .btn-download { background: #2ecc71; margin-left: 5px; text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 6px; color: white;}
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Now Playing</h2>
        <div class="track-info" id="current-track">Select a track below</div>
        <audio id="audio-player" controls autoplay></audio>
    </div>

    <h3>Channel Tracks</h3>
    <div id="playlist">Loading files from Channel...</div>

    <script>
        // Initialize Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Open full screen

        const BACKEND_URL = window.location.origin; // Dynamically sets to your deployed URL
        const audioPlayer = document.getElementById('audio-player');
        const currentTrackLabel = document.getElementById('current-track');

        async def loadPlaylist() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/playlist`);
                const tracks = await response.json();
                const playlistDiv = document.getElementById('playlist');
                playlistDiv.innerHTML = '';

                if(tracks.length === 0) {
                    playlistDiv.innerHTML = 'No audio files found in the channel.';
                    return;
                }

                tracks.forEach(track => {
                    const div = document.createElement('div');
                    div.className = 'track-item';
                    div.innerHTML = `
                        <div>
                            <strong>${track.title}</strong><br>
                            <small style="color: #8a99a6;">${track.artist}</small>
                        </div>
                        <div>
                            <button class="btn" onclick="playTrack(${track.id}, '${track.title.replace(/'/g, "\\'")}')">Play</button>
                            <a class="btn-download" href="${BACKEND_URL}/api/stream/${track.id}" download="${track.title}.mp3">↓</a>
                        </div>
                    `;
                    playlistDiv.appendChild(div);
                });
            } catch (err) {
                document.getElementById('playlist').innerHTML = 'Error loading channel database.';
            }
        }

        function playTrack(msgId, title) {
            currentTrackLabel.innerText = title;
            // Direct request pointing to our stream proxy endpoint
            audioPlayer.src = `${BACKEND_URL}/api/stream/${msgId}`;
            audioPlayer.play();
        }

        // Initialize fetching on load
        loadPlaylist();
    </script>
</body>
</html>
